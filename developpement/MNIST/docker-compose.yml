services:
  api:
    image: mnist-flask-app:latest
    build:
      context: .
      dockerfile: Dockerfile-api
    ports:
      - "5075:5075"

  gradio-app:
    image: mnist-gradio-app:latest
    build:
      context: .
      dockerfile: Dockerfile-gradio
    ports:
      - "7860:7860"
    depends_on:
      - api
